replicaCount: 1

image:
  registry: ""
  repository: lovable/cyber-hello
  tag: "latest"
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: private-registry

service:
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  gatewaySelector:
    istio: aks-istio-ingressgateway-external
  hosts:
    - "*"
