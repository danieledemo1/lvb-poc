{{- if .Values.ingress.enabled }}
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: {{ .Release.Name }}
spec:
  hosts:
    {{- toYaml .Values.ingress.hosts | nindent 4 }}
  gateways:
    - {{ required "Set ingress.gateway to the shared Istio Gateway reference." .Values.ingress.gateway | quote }}
  http:
    - match:
        - uri:
            exact: /app
      redirect:
        uri: /app/
        redirectCode: 301
    - match:
        - uri:
            prefix: /app/
      rewrite:
        uri: /
      route:
        - destination:
            host: {{ printf "%s.%s.svc.cluster.local" .Release.Name .Release.Namespace | quote }}
            port:
              number: {{ .Values.service.port }}
{{- end }}
