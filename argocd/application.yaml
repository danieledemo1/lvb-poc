apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lovable-components
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/danieledemo1/lvb-poc.git
    targetRevision: main
    path: lovable-components
    helm:
      valueFiles:
        - values.yaml
      parameters:
        - name: registry.url
          value: '${REGISTRY_URL}'
          forceString: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      selfHeal: true
